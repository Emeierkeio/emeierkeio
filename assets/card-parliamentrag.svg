<svg xmlns="http://www.w3.org/2000/svg" width="200" height="132" viewBox="0 0 200 132" role="img" aria-label="ParliamentRAG, www.parliamentrag.it">
<style>
.s{fill:none;stroke:#12171a;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.65,0,.35,1) 0.00s forwards}
.d{fill:#2D5F8F;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .45s cubic-bezier(.34,1.56,.64,1) 0.75s forwards}
.n{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#12171a;letter-spacing:-.2px}
.u{font:12px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;fill:#5b6470}
.t{opacity:0;animation:fade .5s ease-out 0.50s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@media (prefers-color-scheme:dark){.s{stroke:#eceae4}.d{fill:#7AA6D2}.n{fill:#eceae4}.u{fill:#9aa3b0}}
@media (prefers-reduced-motion:reduce){.s,.d,.t{animation:none;stroke-dashoffset:0;transform:none;opacity:1}}
</style>
